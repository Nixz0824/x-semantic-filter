<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>X 语义过滤器</title>
  <style>
    :root {
      --bg: #fff;
      --text: #0f1419;
      --muted: #536471;
      --line: #e6eaee;
      --accent: #1d9bf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .title { font-weight: 600; font-size: 14px; }
    .state { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .switch { display: inline-flex; cursor: pointer; }
    .switch input { display: none; }
    .track { width: 42px; height: 24px; border-radius: 999px; background: #cfd6dd; position: relative; transition: background .18s; }
    .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .18s; }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track .thumb { transform: translateX(18px); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); font-size: 10.5px; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1; appearance: none; border: 1px solid var(--line); background: #fff; color: var(--text);
      font-family: inherit; font-size: 12px; padding: 8px; border-radius: 9px; cursor: pointer;
    }
    button:hover { background: #f2f5f8; }
    .primary { background: var(--text); border-color: var(--text); color: #fff; }
    .primary:hover { background: #272c30; }
    .foot { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181c; --text: #e7e9ea; --muted: #8b98a5; --line: #2a2f35; }
      button { background: #1c1f23; }
      .primary { background: #e7e9ea; border-color: #e7e9ea; color: #0f1419; }
    }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <div class="title">X 语义过滤器</div>
      <div class="state" id="state">读取中…</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="track"><span class="thumb"></span></span>
    </label>
  </div>

  <div class="stats">
    <div class="stat"><b id="s1">0</b><small>已判断</small></div>
    <div class="stat"><b id="s2">0</b><small>已过滤</small></div>
    <div class="stat"><b id="s3">0</b><small>出错</small></div>
  </div>

  <div class="row">
    <button class="primary" id="open">打开设置</button>
    <button id="refresh">刷新 X</button>
  </div>

  <div class="foot" id="foot"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
